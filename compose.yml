services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ticket_app
      POSTGRES_PASSWORD: local_learning_only
      POSTGRES_DB: tickets
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ticket_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_app -d tickets"]
      interval: 2s
      timeout: 5s
      retries: 15
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ticket_app:local_learning_only@db:5432/tickets
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  ticket_data:
